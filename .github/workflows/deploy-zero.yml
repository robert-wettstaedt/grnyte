name: Deploy Zero

permissions:
  contents: read

on:
  push:
    branches: [main, master]
    paths:
      - 'deployment/**'
      - 'src/lib/zero/**'
  workflow_dispatch:

jobs:
  setup-repo:
    runs-on: ubuntu-latest
    environment: 'Production – grnyte.rocks'
    steps:
      # Only the three values needed to reach the box.
      - name: Load VPS access from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            00050332-e579-440d-981b-b4b100937e3b > VPS_SSH_KEY
            1e8728fb-6dc4-436f-beeb-b4b10092ea48 > VPS_HOST
            3669b3d5-cdce-4964-84f1-b4b10092e14d > VPS_USER

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Setup deployment repository
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            DEPLOY_DIR="$HOME/zero-deployment"

            # Clean up and setup fresh repository
            rm -rf "$DEPLOY_DIR"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Clone repository
            git clone -b ${{ github.ref_name }} ${{ github.server_url }}/${{ github.repository }}.git .

            # Verify deployment files exist
            if [ ! -d "deployment" ]; then
              echo "❌ deployment directory not found"
              exit 1
            fi

            echo "✅ Repository setup complete ($(git rev-parse --short HEAD))"
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa

  prepare-envs:
    needs: setup-repo
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          # `secret_ids` is the allowlist for this leg, and the reason it is here rather than in a
          # GitHub variable: the canary runs under the prod environment too but needs a completely
          # different set. An allowlist nobody can review in a diff is not one.
          #
          # Deliberately not every ZERO_* the project holds, and deliberately not a count either:
          # the step below writes whichever ones are listed here, so this list grows by one line and
          # a number in a comment would be wrong the first time it did.
          #
          # `docker-compose.zero.yml` still sets ZERO_REPLICA_FILE and ZERO_SCHEMA_PATH itself, and
          # correctly: they are the other half of the volume and bind mounts declared beside them,
          # so the vault has no business holding a second opinion. The tunables used to be there
          # too, which meant editing them in the vault did nothing, because `environment:` overrides
          # `env_file:`.
          - name: prod
            env_name: 'Production – grnyte.rocks'
            secret_ids: |
              76a2770c-07be-43cf-9e3b-b4b1008f6fea > ZERO_UPSTREAM_DB
              58b5ae86-d1fd-4f35-a2c4-b4b1008f77b3 > ZERO_AUTH_SECRET
              51211711-cad0-4fb0-8b1f-b4b1008ea602 > ZERO_ADMIN_PASSWORD
              400816f4-0057-445e-918e-b4b1008e2bb0 > ZERO_GET_QUERIES_URL
              771a3ac5-99f8-443f-b067-b4e700b0af23 > ZERO_MUTATE_URL
              987da712-d3a3-4a2c-a2fb-b4cb014e9092 > ZERO_CVR_DB
              db33aff4-7994-4cfe-bc01-b4b1008ddc21 > ZERO_NUM_SYNC_WORKERS
              a6c1d4f6-a8b8-47bc-b3a0-b4b1008dd02d > ZERO_CVR_MAX_CONNS
              cc7bb4d8-6654-4b89-b306-b4b1008dd661 > ZERO_UPSTREAM_MAX_CONNS
              00050332-e579-440d-981b-b4b100937e3b > VPS_SSH_KEY
              1e8728fb-6dc4-436f-beeb-b4b10092ea48 > VPS_HOST
              3669b3d5-cdce-4964-84f1-b4b10092e14d > VPS_USER
    environment: ${{ matrix.environment.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Replaces `curl https://bws.bitwarden.com/install | sh`, which fetched an unpinned script over
      # the network into a job holding an access token to the whole project. The action is pinned by
      # commit, and it masks every value it retrieves, which the bare CLI does not.
      - name: Load ${{ matrix.environment.name }} secrets from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: ${{ matrix.environment.secret_ids }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # The access token is the only thing that says which environment this is: its machine account
      # can read the grnyte-prod project and nothing else.
      - name: Prepare ${{ matrix.environment.name }} environment
        env:
          SECRET_IDS: ${{ matrix.environment.secret_ids }}
        run: |
          # Only the Zero server's half reaches the VPS: the app's secrets (DATABASE_URL, the
          # service role key) have no business sitting there, and now they are never fetched at all
          # rather than fetched and filtered.
          #
          # Which keys to send is READ OFF THE ALLOWLIST rather than repeated here. A second copy
          # of the list is a copy that drifts, and it did within a day: a ZERO_* added to the matrix
          # above but not to a hardcoded list here would be fetched and then silently dropped, so
          # the VPS would run without it and nothing would say so.
          #
          # Quoted values, matching what `secrets.mjs pull` used to render, so the file on the box
          # keeps the exact shape docker compose already reads. A missing value fails here instead
          # of writing an empty one, which the old `grep || exit` could not catch per key.
          : > env.zero
          for key in $(printf '%s\n' "$SECRET_IDS" | awk '/>/ { print $NF }' | grep '^ZERO_'); do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "❌ $key is empty: the ${{ matrix.environment.name }} mapping in the matrix is missing it"
              exit 1
            fi
            printf '%s="%s"\n' "$key" "$value" >> env.zero
          done

          ssh "$VPS_USER@$VPS_HOST" \
            "cat > \$HOME/zero-deployment/deployment/.env.${{ matrix.environment.name }}" < env.zero
          rm -f env.zero

          echo "✅ Environment configured for ${{ matrix.environment.name }}"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa

  deploy-infrastructure:
    needs: prepare-envs
    runs-on: ubuntu-latest
    environment: 'Production – grnyte.rocks'
    steps:
      # Only the three values needed to reach the box.
      - name: Load VPS access from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            00050332-e579-440d-981b-b4b100937e3b > VPS_SSH_KEY
            1e8728fb-6dc4-436f-beeb-b4b10092ea48 > VPS_HOST
            3669b3d5-cdce-4964-84f1-b4b10092e14d > VPS_USER

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Check Docker IPv6 support
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            echo "Checking if Docker IPv6 is enabled..."
            if [ ! -f /etc/docker/daemon.json ] || ! grep -q '"ipv6"[[:space:]]*:[[:space:]]*true' /etc/docker/daemon.json; then
              echo "❌ Docker IPv6 is NOT enabled!"
              echo "To enable IPv6 for Docker, do the following as root on your server:"
              echo '1. Create or edit /etc/docker/daemon.json with:'
              echo '   {'
              echo '     "ipv6": true,'
              echo '     "fixed-cidr-v6": "<your:ipv6:subnet::/64>"'
              echo '   }'
              echo '2. Replace <your:ipv6:subnet::/64> with your actual routed IPv6 subnet (e.g., 2a01:4f8:c0c:9b28::/64)'
              echo '3. Restart Docker: systemctl restart docker'
              echo '4. Recreate your containers: docker-compose down && docker-compose up -d'
              exit 1
            else
              echo "✅ Docker IPv6 is enabled."
            fi
          ENDSSH

      - name: Deploy Zero Infrastructure
        run: |
          ssh "$VPS_USER@$VPS_HOST" << 'ENDSSH'
            set -e
            cd $HOME/zero-deployment/deployment

            echo "🚀 Deploying Zero infrastructure..."

            # Verify docker-compose file exists
            if [ ! -f "docker-compose.zero.yml" ]; then
              echo "❌ docker-compose.zero.yml not found"
              exit 1
            fi

            # Parse the file BEFORE the teardown below, which is unconditional and succeeds on its
            # own. A missing env file only fails at `up`, once prod is already stopped.
            if ! docker compose -f docker-compose.zero.yml config --quiet; then
              echo "❌ docker-compose.zero.yml does not resolve; leaving the running stack alone"
              exit 1
            fi

            # Stop existing services
            docker compose -f docker-compose.zero.yml down --remove-orphans || true

            # Clean up Docker resources
            docker network prune -f || true
            docker rm -f zero-server-prod zero-cvr-prod nginx-main certbot-main || true

            # Start services
            echo "Starting Zero servers and nginx..."
            docker compose -f docker-compose.zero.yml up -d

            # Wait for Zero servers to be ready
            echo "⏳ Waiting for Zero servers..."
            for i in {1..30}; do
                if docker exec zero-server-prod curl -f http://localhost:4848 >/dev/null 2>&1; then
                    echo "✅ Zero server is ready"
                    break
                fi
                if [ $i -eq 30 ]; then
                    echo "❌ Zero server failed to start"
                    docker logs zero-server-prod | tail -5
                    exit 1
                fi
                sleep 2
            done

            # Test HTTP accessibility
            echo "🧪 Testing HTTP accessibility..."
            for domain in "zero.grnyte.rocks"; do
                if curl -f -m 10 "http://$domain/" >/dev/null 2>&1; then
                    echo "✅ $domain is accessible via HTTP"
                else
                    echo "⚠️  $domain not accessible (might be normal if DNS hasn't propagated)"
                fi
            done

            echo "🎉 Deployment completed!"
            echo "Services status:"
            docker ps --filter "name=zero-server\|nginx-main" --format "table {{.Names}}\t{{.Status}}"
          ENDSSH

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_rsa
