events {
    worker_connections 1024;
}

http {
    # Docker DNS resolver: the PowerSync block resolves its upstream per request, so nginx starts without it.
    resolver 127.0.0.11 valid=30s;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name zero.grnyte.rocks sync.grnyte.rocks;
        return 301 https://$host$request_uri;
    }

    # PowerSync: one long-lived streamed response per client, so nothing may buffer it or time it out.
    server {
        listen 443 ssl;
        http2 on;
        server_name sync.grnyte.rocks;

        ssl_certificate /etc/letsencrypt/live/sync.grnyte.rocks/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sync.grnyte.rocks/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # The admin API (diagnostics, validation) is reached from inside the docker network only.
        location /api/admin/ {
            deny all;
        }

        # The sidecar's verdict from the diagnostics API, for uptime checks and the app's Sync health screen.
        location = /health/sync {
            set $sync_health http://sync-health-prod:8080;
            proxy_pass $sync_health;
            proxy_read_timeout 15s;
        }

        location / {
            set $powersync http://powersync-prod:8080;
            proxy_pass $powersync;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # HTTP/1.1 for the streamed response, and the upgrade for clients that use the WebSocket transport.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }

    # HTTPS for production
    server {
        listen 443 ssl;
        http2 on;
        server_name zero.grnyte.rocks;

        ssl_certificate /etc/letsencrypt/live/zero.grnyte.rocks/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zero.grnyte.rocks/privkey.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://zero-server-prod:4848;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer sizes to handle large upstream headers
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }
    }
}
