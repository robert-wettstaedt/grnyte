services:
  # Client view records for prod, beside zero-cache instead of in the upstream Supabase.
  #
  # They are read and written on the critical path of every query registration, and unset they
  # default to upstream-db, which puts them in Frankfurt while this box is in Nuremberg. Derived
  # state, so there is no backup and losing the volume costs clients one re-sync: see
  # `deployment/README.md` beside `ZERO_CVR_DB` before adding it to `backup-db.yml`.
  #
  # Prod only: demo is being torn down and is linked from nowhere, so it is not worth a second
  # database. That leaves no rehearsal environment, so the empty-database case was proven locally
  # instead: zero-cache creates its own CVR schema, with no manual bootstrap step. Rolling back is
  # reverting `ZERO_CVR_DB` and redeploying, and the previous records are still in the upstream
  # schema, so the blast radius of being wrong is a failed deploy rather than lost data.
  #
  # On `cvr_network` and nothing else, which nginx is not on and which is `internal: true`, so the
  # only thing that can route to this database is the one container that would hold its credentials
  # anyway. That is what makes trust auth right here rather than lazy, and it keeps the whole thing
  # to the single `ZERO_CVR_DB` secret. A password would need a second one, and the deploy's env
  # writer only passes `ZERO_*` keys through to the box, so it would be fetched and silently
  # dropped.
  cvr-prod:
    image: postgres:17-alpine
    container_name: zero-cvr-prod
    environment:
      - POSTGRES_USER=zero
      - POSTGRES_DB=cvr
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - cvr_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zero -d cvr']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cvr_network

  zero-prod:
    # Must move in lockstep with `@rocicorp/zero` in package.json, server deployed first.
    image: rocicorp/zero:1.9.0
    container_name: zero-server-prod
    expose:
      - '4848'
    env_file:
      - .env.prod
    # Only what this file is the authority on. `environment:` overrides `env_file:`, so anything
    # listed here silently wins over the value Bitwarden holds, and a knob in both places is a knob
    # you cannot turn.
    #
    # The two paths stay because they are half of a fact stated below: `/data` is the named volume
    # and `/opt/app/zero-schema.ts` is the bind mount. Split them into the vault and it could disagree
    # with the mount, and the container would die on a missing file for a reason invisible from
    # either side alone. FORWARD_COOKIES stays because it is a correctness requirement rather than a
    # preference: zero-cache has to forward the browser cookie for the get-queries endpoint to
    # authenticate at all (see `auth.server.ts`), so it is true in every environment or none.
    #
    # Tunables are NOT here. ZERO_CVR_MAX_CONNS, ZERO_UPSTREAM_MAX_CONNS and ZERO_NUM_SYNC_WORKERS
    # come from the project through `.env.<env>`, so prod and demo can differ.
    environment:
      - ZERO_REPLICA_FILE=/data/sync-replica.db
      - ZERO_SCHEMA_PATH=/opt/app/zero-schema.ts
      - ZERO_GET_QUERIES_FORWARD_COOKIES=true
    volumes:
      # Under /opt/app, the image's WORKDIR, because the gen file imports `@rocicorp/zero` for
      # real and only /opt/app/node_modules resolves it. Both files, because zero-schema.ts
      # imports the gen one at RUNTIME. Either mistake is the same ERR_MODULE_NOT_FOUND at boot.
      - ../src/lib/zero/zero-schema.ts:/opt/app/zero-schema.ts:ro
      - ../src/lib/zero/zero-schema.gen.ts:/opt/app/zero-schema.gen.ts:ro
      - zero_data_prod:/data
    restart: unless-stopped
    # Without this zero-cache races the database on a cold boot of the whole stack and exits.
    depends_on:
      cvr-prod:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4848']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - zero_network
      - cvr_network

  zero-demo:
    # Must move in lockstep with `@rocicorp/zero` in package.json, server deployed first.
    image: rocicorp/zero:1.9.0
    container_name: zero-server-demo
    expose:
      - '4848'
    env_file:
      - .env.demo
    # Only what this file is the authority on. `environment:` overrides `env_file:`, so anything
    # listed here silently wins over the value Bitwarden holds, and a knob in both places is a knob
    # you cannot turn.
    #
    # The two paths stay because they are half of a fact stated below: `/data` is the named volume
    # and `/opt/app/zero-schema.ts` is the bind mount. Split them into the vault and it could disagree
    # with the mount, and the container would die on a missing file for a reason invisible from
    # either side alone. FORWARD_COOKIES stays because it is a correctness requirement rather than a
    # preference: zero-cache has to forward the browser cookie for the get-queries endpoint to
    # authenticate at all (see `auth.server.ts`), so it is true in every environment or none.
    #
    # Tunables are NOT here. ZERO_CVR_MAX_CONNS, ZERO_UPSTREAM_MAX_CONNS and ZERO_NUM_SYNC_WORKERS
    # come from the project through `.env.<env>`, so prod and demo can differ.
    environment:
      - ZERO_REPLICA_FILE=/data/sync-replica.db
      - ZERO_SCHEMA_PATH=/opt/app/zero-schema.ts
      - ZERO_GET_QUERIES_FORWARD_COOKIES=true
    volumes:
      - ../src/lib/zero/zero-schema.ts:/opt/app/zero-schema.ts:ro
      - ../src/lib/zero/zero-schema.gen.ts:/opt/app/zero-schema.gen.ts:ro
      - zero_data_demo:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4848']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - zero_network

  nginx:
    image: nginx:alpine
    container_name: nginx-main
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.zero.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    depends_on:
      - zero-prod
      - zero-demo
    networks:
      - zero_network

networks:
  zero_network:
    driver: bridge
    enable_ipv6: true
  # `internal: true` is the half that makes trust auth on `cvr-prod` safe: no gateway, so nothing
  # on this network can reach the internet or be reached from it. nginx is deliberately absent.
  cvr_network:
    driver: bridge
    internal: true

volumes:
  zero_data_prod:
  zero_data_demo:
  cvr_data_prod:
