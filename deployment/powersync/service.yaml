# PowerSync service. Every value that differs per environment comes from a `PS_*` variable (the service refuses any
# other prefix in `!env`).
telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: !env PS_DATA_SOURCE_SSLMODE

# Bucket storage: derived state, rebuilt from Postgres if lost, so it is not backed up.
storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  supabase: true
  supabase_jwt_secret: !env PS_SUPABASE_JWT_SECRET
  audience: ['authenticated']

api:
  parameters:
    # The default rejected 550 of 750 reconnecting devices with 429 in the trial.
    max_concurrent_connections: 2000
    max_parameter_query_results: 10000
    max_buckets_per_connection: 10000
  tokens:
    - !env PS_ADMIN_TOKEN
